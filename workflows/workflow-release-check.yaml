id: 980d1aa0-dfc8-447c-893f-67efc886f666
name: release-check
description: >-
  barmark's release gate: lint, typecheck and tests, Fallow (dead code,
  duplication, complexity beyond the baseline), the npm package (contents
  and a Node import), for engraver the equivalence gate (stock Verovio and
  the build draw the same SVG), and release readiness (version, CHANGELOG, tag and npm
  free, clean main), each run by the barmark behavior and kept as data, then
  asserted clean. Run `bunx varlock run -- swamp workflow run release-check`
  after the version-bump commit (RELEASING.md); pass `--input allowDirty=true`
  while preparing on a branch, and `--input pkg=render` or `pkg=cli` to
  check @barmark/render or @barmark/cli instead of barmark; `pkg=engraver`
  needs a compiled packages/engraver/dist and the root `bun run build`.
tags:
  area: release
inputs:
  properties:
    pkg:
      type: string
      enum: [barmark, render, musicxml, score, sync, midi, listen, cli, engraver]
      default: barmark
      description: The workspace package whose package and release checks run; `engraver` also runs the equivalence gate
    allowDirty:
      type: boolean
      default: false
      description: Skip the clean-tree and on-main checks (while preparing a release)
jobs:
  - name: checks
    description: Run every check against the checkout
    steps:
      - name: gates
        description: Biome, tsc and bun test
        task:
          type: behavior
          behavior: barmark
          methodName: gates
      - name: health
        description: Fallow - dead code, duplication, complexity beyond the baseline
        task:
          type: behavior
          behavior: barmark
          methodName: health
        dependsOn:
          - step: gates
            condition:
              type: succeeded
      - name: package
        description: Build, npm pack contents, Node import and smoke test
        task:
          type: behavior
          behavior: barmark
          methodName: package
          inputs:
            pkg: ${{ inputs.pkg }}
        dependsOn:
          - step: health
            condition:
              type: succeeded
      - name: equivalence
        description: For engraver, stock Verovio and the build draw the same SVG; skipped otherwise
        task:
          type: behavior
          behavior: barmark
          methodName: equivalence
          inputs:
            pkg: ${{ inputs.pkg }}
        dependsOn:
          - step: package
            condition:
              type: succeeded
      - name: release
        description: Version, CHANGELOG section, tag and npm version free, clean main
        task:
          type: behavior
          behavior: barmark
          methodName: release
          inputs:
            pkg: ${{ inputs.pkg }}
            allowDirty: ${{ inputs.allowDirty }}
        dependsOn:
          - step: equivalence
            condition:
              type: succeeded
  - name: verify
    description: Fail the run when any check found a problem
    dependsOn:
      - job: checks
        condition:
          type: succeeded
    steps:
      - name: gates-clean
        description: Lint, typecheck and every test pass
        task:
          type: assert
          expr: data.latest("barmark", "gates").attributes.ok
          message: '${{ "Gates: " + data.latest("barmark", "gates").attributes.summary }}'
          severity: high
      - name: health-clean
        description: No dead code, no duplication, no complexity beyond the baseline
        task:
          type: assert
          expr: data.latest("barmark", "health").attributes.ok
          message: '${{ "Fallow: " + data.latest("barmark", "health").attributes.summary }}'
          severity: high
      - name: package-clean
        description: The package publishes the right files and runs in Node
        task:
          type: assert
          expr: data.latest("barmark", "package").attributes.ok
          message: '${{ "Package: " + data.latest("barmark", "package").attributes.summary }}'
          severity: high
      - name: equivalence-clean
        description: For engraver, stock and build engrave every chart byte-identically
        task:
          type: assert
          expr: data.latest("barmark", "equivalence").attributes.ok
          message: '${{ "Equivalence: " + data.latest("barmark", "equivalence").attributes.summary }}'
          severity: high
      - name: release-ready
        description: The version is ready to tag and publish
        task:
          type: assert
          expr: data.latest("barmark", "release").attributes.ok
          message: '${{ "Release: " + data.latest("barmark", "release").attributes.summary }}'
          severity: high
version: 1
