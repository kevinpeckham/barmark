# @barmark/engraver's dist, shared by ci.yml's `engraver` job and
# release.yml's `build-engraver` job, so the two build it the same way.
# Verovio compiled by emsdk must match packages/engraver/src/info.ts byte for
# byte. A restored dist is checked against info.ts; a miss compiles from
# clean (about 4.5 minutes). Then the equivalence gate, in Node 22; after a
# compile, build/source.sh's Corresponding Source, checked and not uploaded;
# and the engraver-dist artifact, which later jobs download into
# packages/engraver/dist.
#
# The job runs checkout, setup-bun, setup-node 22 and `bun install` first.
name: engraver-build
description: Compile or restore @barmark/engraver's dist, check it against info.ts, run the equivalence gate and upload engraver-dist
inputs:
  clean:
    description: "'true' skips the dist cache and always compiles"
    required: true
  save-cache:
    description: "'true' saves the tools cache and, after a clean build that matched info.ts, the dist cache"
    required: true
runs:
  using: composite
  steps:
    - id: dist
      if: inputs.clean != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: packages/engraver/dist/verovio-module.*
        key: engraver-dist-${{ hashFiles('packages/engraver/build/**', 'packages/engraver/package.json') }}
    # The pinned emsdk and CMake (build.sh's cache, 540 MB), keyed on their pins: only a compile needs them.
    - id: tools
      if: steps.dist.outputs.cache-hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/barmark-engraver/emsdk
          ~/.cache/barmark-engraver/venv
        key: engraver-tools-${{ hashFiles('packages/engraver/build/versions.env') }}
    # A miss (or clean): build from clean, then check against info.ts (compile fails on any difference).
    - if: steps.dist.outputs.cache-hit != 'true'
      shell: bash
      working-directory: packages/engraver
      run: bun run compile
    # A hit: check the restored files against info.ts, refusing a dist without them.
    - if: steps.dist.outputs.cache-hit == 'true'
      shell: bash
      working-directory: packages/engraver
      run: bun run build --require-module
    - if: inputs.save-cache == 'true' && steps.tools.outputs.cache-hit != 'true' && steps.dist.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/barmark-engraver/emsdk
          ~/.cache/barmark-engraver/venv
        key: engraver-tools-${{ hashFiles('packages/engraver/build/versions.env') }}
    # Only a clean build that matched info.ts gets here without a hit.
    - if: inputs.save-cache == 'true' && steps.dist.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: packages/engraver/dist/verovio-module.*
        key: engraver-dist-${{ hashFiles('packages/engraver/build/**', 'packages/engraver/package.json') }}
    - shell: bash
      run: bun run build
    # The equivalence gate: stock Verovio and this build, in Node 22, must draw
    # the corpus's SVG byte for byte. Its summary reports the timings (Q1: the
    # slowest width-375 engraving) without gating on them.
    - shell: bash
      run: |
        if ! node --version | grep -q '^v22'; then
          echo "::error::node 22 required (the gate's Node), not $(node --version)"; exit 1
        fi
        bun scripts/engraver-equivalence.ts
    # The Corresponding Source (build/source.sh), whenever this action
    # compiled and so has the Verovio clone: the weekly clean run and every
    # dist-cache miss exercise what an engraver tag runs, before a tag is
    # made. Checked here, uploaded only by release.yml on an engraver tag.
    - if: steps.dist.outputs.cache-hit != 'true'
      shell: bash
      run: |
        bash packages/engraver/build/source.sh "$RUNNER_TEMP/source"
        out="$RUNNER_TEMP/source"
        source packages/engraver/build/versions.env
        verovio="verovio-${VEROVIO_TAG#version-}"
        build=$(tar -tzf "$out"/engraver-build-*.tar.gz)
        for f in build.sh versions.env source.sh; do
          grep -qx "engraver-build-[^/]*/$f" <<<"$build" || { echo "::error::engraver-build lacks $f"; exit 1; }
        done
        src=$(tar -tzf "$out/$verovio-source.tar.gz")
        for f in cmake/CMakeLists.txt emscripten/exports.txt src/toolkit.cpp include/vrv/toolkit.h COPYING.LESSER; do
          grep -qx "$verovio/$f" <<<"$src" || { echo "::error::$verovio-source lacks $f"; exit 1; }
        done
        ls -l "$out"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: engraver-dist
        path: |
          packages/engraver/dist/verovio-module.mjs
          packages/engraver/dist/verovio-module.wasm
        if-no-files-found: error
        retention-days: 7
