# Monthly, grouped updates for the SHA-pinned actions and the exactly pinned
# dev dependencies. Each pull request runs CI (and Fallow) like any other.
# The cooldown skips releases younger than two weeks, so a compromised
# release has time to be caught before it is proposed here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: chore
      include: scope
