# Lint, typecheck, test, Fallow and package check on every push to main and
# every pull request. The same scripts back the local Swamp release check.
# main's ruleset requires the check and package jobs by name: renaming a job
# or a matrix entry means updating the ruleset (RELEASING.md).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to the same pull request cancels the run it replaces; runs on
# main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      # Dead code, duplication and complexity beyond .fallow-health-baseline.json;
      # findings show as annotations on the pull request.
      - run: bun run fallow --format github-annotations
  # Each published package must import and run under every Node it supports.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22, 24]
        pkg: [barmark]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run verify:package ${{ matrix.pkg }}
