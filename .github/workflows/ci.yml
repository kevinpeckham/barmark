# Lint, typecheck, test, Fallow and package check on every push to main and
# every pull request, and weekly on main (Monday), when the engraver builds
# from clean with no dist cache. The same scripts back the local Swamp
# release check. main's ruleset requires the check, engraver and package jobs
# by name, `package (N, engraver)` among them: renaming a job or a matrix
# entry means updating the ruleset (RELEASING.md).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  # The weekly clean rebuild of @barmark/engraver; it needs no secret.
  schedule:
    - cron: "17 5 * * 1"
  # Runs the weekly path by hand: `gh workflow run ci.yml --ref <branch>`
  # skips the dist cache too, as a scheduled run does.
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same pull request cancels the run it replaces; runs on
# main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      # The MusicXML tests validate against the schema with xmllint.
      - run: sudo apt-get install -y -q libxml2-utils
      - run: bun test
      # Dead code, duplication and complexity beyond .fallow-health-baseline.json;
      # findings show as annotations on the pull request.
      - run: bun run fallow --format github-annotations
  # @barmark/engraver: Verovio compiled by emsdk, which must match
  # packages/engraver/src/info.ts byte for byte (.github/actions/engraver-build).
  # A restored dist is checked against info.ts; a miss compiles from clean
  # (about 4.5 minutes), and only that clean build, once it has matched
  # info.ts, writes the dist cache. The weekly and hand-dispatched runs skip
  # the dist cache and always compile. Later jobs take the files from the
  # engraver-dist artifact.
  engraver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # The build, its caches, the gate and the engraver-dist artifact, shared
      # with release.yml's build-engraver job.
      - uses: ./.github/actions/engraver-build
        with:
          clean: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          save-cache: true
  # The renderer in a real browser: isolation from hostile page CSS, themes,
  # reflow on narrow screens and at 400% zoom, the web component, and what a
  # screen reader hears.
  browser:
    needs: engraver
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engraver-dist
          path: packages/engraver/dist
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
  # Each published package must import and run under every Node it supports.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22, 24]
        pkg: [barmark, render, musicxml, score, sync, midi, cli]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run verify:package ${{ matrix.pkg }}
  # @barmark/engraver under every Node it supports, packed from the engraver
  # job's artifact: no emcc here, and prepack never compiles.
  package-engraver:
    name: package (${{ matrix.node }}, engraver)
    needs: engraver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engraver-dist
          path: packages/engraver/dist
      - run: bun run verify:package engraver
  # The CLI's floor (engines: >=20.6): node-io.ts uses import.meta.resolve,
  # unflagged in Node 20.6. TypeScript 7's tsc can't run on 20.6 (an
  # extensionless ESM bin), so this builds with Node 24, then packs,
  # installs and runs the CLI with 20.6.
  cli-node-floor:
    name: package (20.6.0, cli)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.6.0"
      - run: node --version
      - run: bun run verify:package cli --no-build
  # barmark.dev (site/): its own install from npm, svelte-check, its tests
  # (the guide's examples against the published parser) and its browser suite.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
  # Goes red when a package is released and the site still runs the older
  # version: the reminder to open the bump PR (RELEASING.md). Not a required
  # check, so it never blocks an unrelated pull request.
  site-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun site/scripts/check-versions.ts
