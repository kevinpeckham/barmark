# Temporary (removed in the engraver plan's Task 4): does the path-mapped
# Verovio build come out byte-identical on a GitHub runner and on the VM?
name: engraver-repro
on:
  pull_request:
    paths:
      - packages/engraver/build/**
      - .github/workflows/engraver-repro.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bash packages/engraver/build/build.sh "$RUNNER_TEMP/dist"
      - run: sha256sum "$RUNNER_TEMP"/dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engraver-repro
          path: ${{ runner.temp }}/dist/*
          retention-days: 7
