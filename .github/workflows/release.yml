# Publishes barmark to npm via Trusted Publishing (OIDC): no tokens,
# provenance attested. Trigger: a GitHub release, or manual dispatch on a
# release tag. npmjs.com package settings -> Trusted Publisher must name
# this repo, this file (release.yml) and the npm environment. The process
# is in RELEASING.md.
name: release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions: {} # nothing by default; each job asks for exactly what it needs
# One release at a time, and never cancel one part-way through a publish.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # Every gate runs here, and the tarball is packed here, without the OIDC
  # identity: Bun, the dev dependencies and their install scripts never run
  # in a job that can publish.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Actions pinned to commit SHAs: a compromised version tag must not be
      # able to change what is packed or published. Dependabot proposes
      # updates (.github/dependabot.yml); check each SHA against its tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: The tag names the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::ref ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi
      - run: bun run check
      - run: bun test
      - run: bun run fallow
      - run: bun run verify:package
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: barmark-*.tgz
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Waits for Kevin's approval (environment protection), and npm's trusted
    # publisher accepts only runs in this environment.
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing's OIDC exchange with the registry needs npm >= 11.5;
      # node 22 ships npm 10.9, which signs provenance but then PUTs
      # unauthenticated (the 404 on this workflow's first run). Pinned
      # exactly: an unpinned install inside a job holding the OIDC
      # identity is the same supply-chain exposure as an unpinned action.
      - run: npm install -g npm@12.2.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - run: npm publish ./barmark-*.tgz --access public --provenance
  # Install the version just published, from npm, as a user would, and read
  # a real chart with it. The registry can take a few minutes to serve a new
  # version (FINDINGS.md), so wait for it first.
  confirm:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Wait for npm to serve the new version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 60); do
            if [ "$(npm view "barmark@${version}" version --prefer-online 2>/dev/null)" = "${version}" ]; then
              echo "barmark@${version} is on npm"; exit 0
            fi
            sleep 10
          done
          echo "::error::barmark@${version} is not visible on npm after 10 minutes"; exit 1
      - name: Install from npm and read Peaceful Dreams
        run: |
          dir="$RUNNER_TEMP/confirm"
          mkdir -p "$dir" && cd "$dir"
          npm init -y >/dev/null
          npm install --ignore-scripts "barmark@${GITHUB_REF_NAME#v}"
          cp "$GITHUB_WORKSPACE/scripts/smoke.mjs" .
          node smoke.mjs barmark "$GITHUB_WORKSPACE/examples/peaceful-dreams.chart.md"
