# Publishes one workspace package to npm via Trusted Publishing (OIDC): no
# tokens, provenance attested. The tag names the package: barmark-vX.Y.Z
# publishes packages/barmark (barmark), render-vX.Y.Z publishes
# packages/render (@barmark/render), cli-vX.Y.Z publishes packages/cli
# (@barmark/cli) and attaches its standalone binaries, and engraver-vX.Y.Z
# publishes packages/engraver (@barmark/engraver) and attaches its
# Corresponding Source and licence files. Every tag first builds the
# engraver (build-engraver), because score's browser suite in verify loads
# it: an engraver tag compiles from clean with no dist cache, any other tag
# uses the dist cache as CI does. Trigger: a GitHub release, or manual
# dispatch on a release tag. Each package's npmjs.com settings -> Trusted
# Publisher must name this repo, this file (release.yml) and the npm
# environment. The process is in RELEASING.md. setup-bun and setup-node keep
# no cache of their own here (no-cache, package-manager-cache): a release
# must not run a Bun binary or packages restored from a cache that another
# run wrote. The engraver's caches are the one exception, explained below.
name: release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions: {} # nothing by default; each job asks for exactly what it needs
# One release at a time, and never cancel one part-way through a publish.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # @barmark/engraver's dist (.github/actions/engraver-build, as CI's engraver
  # job builds it), checked against info.ts and put through the equivalence
  # gate, for verify. Restore-only: a release never writes a cache. A tag run
  # reads caches from its own tag and from main, never from a pull request.
  # An engraver tag skips the dist cache and compiles from clean, so the only
  # cache under what it publishes is the pinned toolchain, and compile fails
  # unless the output's sizes and sha384 match the committed info.ts. On an
  # engraver tag it also bundles the Corresponding Source for attach-source.
  build-engraver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/engraver-build # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form (rhysd/actionlint#711)
        with:
          clean: ${{ startsWith(github.ref_name, 'engraver-v') }}
          save-cache: false
      # Verovio's source at the pinned commit and build/ as committed
      # (source.sh), with the licence files and notices.
      - name: The Corresponding Source
        if: ${{ startsWith(github.ref_name, 'engraver-v') }}
        run: |
          out="$RUNNER_TEMP/source"
          bash packages/engraver/build/source.sh "$out"
          for f in COPYING COPYING.LESSER OFL.txt NOTICE.md THIRD-PARTY.md; do
            cp "packages/engraver/${f}" "$out/"
          done
      - if: ${{ startsWith(github.ref_name, 'engraver-v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engraver-source
          path: ${{ runner.temp }}/source/*
          if-no-files-found: error
          retention-days: 7
  # Every gate runs here, and the tarball is packed here, without the OIDC
  # identity: Bun, the dev dependencies and their install scripts never run
  # in a job that can publish.
  verify:
    needs: build-engraver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
      smoke: ${{ steps.package.outputs.smoke }}
      key: ${{ steps.package.outputs.key }}
    steps:
      # Actions pinned to commit SHAs: a compromised version tag must not be
      # able to change what is packed or published. Dependabot proposes
      # updates (.github/dependabot.yml); check each SHA against its tag.
      # With history and tags: a CLI release checks its libraries against their tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # build-engraver's dist: score's browser suite loads it, and an engraver
      # tag packs it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engraver-dist
          path: packages/engraver/dist
      - name: The tag names a package and its version
        id: package
        run: |
          case "${GITHUB_REF_NAME}" in
            barmark-v*) key=barmark; smoke=scripts/smoke.mjs ;;
            render-v*) key=render; smoke=scripts/smoke-render.mjs ;;
            musicxml-v*) key=musicxml; smoke=scripts/smoke-musicxml.mjs ;;
            score-v*) key=score; smoke=scripts/smoke-score.mjs ;;
            sync-v*) key=sync; smoke=scripts/smoke-sync.mjs ;;
            midi-v*) key=midi; smoke=scripts/smoke-midi.mjs ;;
            cli-v*) key=cli; smoke=scripts/smoke-cli.mjs ;;
            engraver-v*) key=engraver; smoke=scripts/smoke-engraver.mjs ;;
            *) echo "::error::${GITHUB_REF_NAME} is not a release tag (barmark-vX.Y.Z, render-vX.Y.Z, musicxml-vX.Y.Z, score-vX.Y.Z, sync-vX.Y.Z, midi-vX.Y.Z, cli-vX.Y.Z or engraver-vX.Y.Z)"; exit 1 ;;
          esac
          dir="packages/${key}"
          name=$(node -p "require('./${dir}/package.json').name")
          version=$(node -p "require('./${dir}/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "${key}-v${version}" ]; then
            echo "::error::ref ${GITHUB_REF_NAME} does not match ${dir}/package.json version ${version}"
            exit 1
          fi
          { echo "key=${key}"; echo "dir=${dir}"; echo "name=${name}"; echo "version=${version}"; echo "smoke=${smoke}"; } >> "$GITHUB_OUTPUT"
      # The CLI's binaries and the engraver's Corresponding Source go on the
      # tag's GitHub release, after the npm publish. A manual run with no
      # release would publish to npm and then fail to attach them, so it
      # stops here, before anything is published.
      - name: The tag has a GitHub release for its assets
        if: steps.package.outputs.key == 'cli' || steps.package.outputs.key == 'engraver'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null; then
            echo "::error::${GITHUB_REF_NAME} has no GitHub release to attach its assets to; create it (gh release create ${GITHUB_REF_NAME} --verify-tag), which starts this workflow itself"
            exit 1
          fi
      # The binaries bundle the libraries from this checkout, and npm users get
      # the published ones: they must be the same code (verify-release.ts
      # checks the same before tagging).
      - name: The CLI's libraries are their released code
        if: steps.package.outputs.key == 'cli'
        run: |
          for dep in barmark render musicxml sync midi; do
            version=$(node -p "require('./packages/${dep}/package.json').version")
            paths=("packages/${dep}/src")
            [ "$dep" = render ] && paths+=(packages/render/fonts)
            if ! git diff --quiet "${dep}-v${version}" -- "${paths[@]}"; then
              echo "::error::${dep} has changed since ${dep}-v${version}: release it first"; exit 1
            fi
          done
      - run: bun run check
      # The MusicXML tests validate against the schema with xmllint.
      - run: sudo apt-get install -y -q libxml2-utils
      - run: bun test
      - run: bun run fallow
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run verify:package "$KEY"
        env:
          KEY: ${{ steps.package.outputs.key }}
      - run: bun run build
      # bun pm pack, not npm pack: it turns workspace: ranges into versions.
      - run: bun pm pack --ignore-scripts --destination "$GITHUB_WORKSPACE/pack"
        working-directory: ${{ steps.package.outputs.dir }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: pack/*.tgz
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Waits for Kevin's approval (environment protection), and npm's trusted
    # publisher accepts only runs in this environment.
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # Trusted publishing's OIDC exchange with the registry needs npm >= 11.5;
      # node 22 ships npm 10.9, which signs provenance but then PUTs
      # unauthenticated (the 404 on this workflow's first run). Pinned
      # exactly: an unpinned install inside a job holding the OIDC
      # identity is the same supply-chain exposure as an unpinned action.
      - run: npm install -g npm@12.2.1 # zizmor: ignore[adhoc-packages] the publish job's npm, pinned exactly; it has no lockfile to use
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - run: npm publish ./*.tgz --access public --provenance
  # Install the version just published, from npm, as a user would, and read
  # a real chart with it. The registry can take a few minutes to serve a new
  # version (FINDINGS.md), so wait for it first.
  confirm:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Wait for npm to serve the new version
        env:
          PKG: ${{ needs.verify.outputs.name }}@${{ needs.verify.outputs.version }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for _ in $(seq 1 60); do
            if [ "$(npm view "${PKG}" version --prefer-online 2>/dev/null)" = "${VERSION}" ]; then
              echo "${PKG} is on npm"; exit 0
            fi
            sleep 10
          done
          echo "::error::${PKG} is not visible on npm after 10 minutes"; exit 1
      - name: Install from npm and read Peaceful Dreams
        env:
          NAME: ${{ needs.verify.outputs.name }}
          VERSION: ${{ needs.verify.outputs.version }}
          SMOKE: ${{ needs.verify.outputs.smoke }}
        run: | # zizmor: ignore[adhoc-packages] confirm installs the version just published, as a user would
          dir="$RUNNER_TEMP/confirm"
          mkdir -p "$dir" && cd "$dir"
          npm init -y >/dev/null
          npm install --ignore-scripts "${NAME}@${VERSION}"
          cp "$GITHUB_WORKSPACE/${SMOKE}" smoke.mjs
          node smoke.mjs "${NAME}" "$GITHUB_WORKSPACE/examples/peaceful-dreams.chart.md"
  # @barmark/cli only: the standalone binaries (Bun's compiler, the font,
  # Verovio and the versions embedded), smoke-tested on Linux x64. Built read-only from the
  # tagged commit after the npm publish, so a release never carries
  # binaries for a version npm refused.
  binaries:
    needs: [verify, publish]
    if: needs.verify.outputs.key == 'cli'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Compile for each platform
        working-directory: packages/cli
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            out="$RUNNER_TEMP/bin/barmark-${target}"
            case "$target" in windows-*) out="${out}.exe" ;; esac
            bun scripts/compile.ts "$target" "$out"
          done
          cp ../render/fonts/OFL.txt "$RUNNER_TEMP/bin/Edwin-OFL.txt"
          # The binaries bundle Verovio (LGPL-3.0-only): its licence and the GPL it builds on.
          cp licenses/Verovio-LGPL-3.0.txt "$RUNNER_TEMP/bin/Verovio-LGPL-3.0.txt"
          cp licenses/Verovio-GPL-3.0.txt "$RUNNER_TEMP/bin/Verovio-GPL-3.0.txt"
      - name: Run the Linux binary on Peaceful Dreams
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          bin="$RUNNER_TEMP/bin/barmark-linux-x64"
          "$bin" --version | grep -q "^@barmark/cli ${VERSION} "
          "$bin" check examples/peaceful-dreams.chart.md
          "$bin" render --score examples/peaceful-dreams.chart.md | grep -q 'role="img"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/bin/*
          if-no-files-found: error
          retention-days: 7
  # The only job that can write to the release: no checkout, no Bun, no
  # install, just the built files.
  attach:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # gh release upload
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: bin
      - name: Attach the binaries and the font's and Verovio's licences
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" bin/* --clobber --repo "${GITHUB_REPOSITORY}"
  # @barmark/engraver only: the Corresponding Source (Verovio's source at the
  # pinned commit and build/) and the licence files, from build-engraver, on
  # the release once npm serves the version. Like attach: no checkout, no
  # Bun, no install, just the built files.
  attach-source:
    needs: [verify, confirm]
    if: needs.verify.outputs.key == 'engraver'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # gh release upload
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engraver-source
          path: source
      - name: Attach the Corresponding Source and the licence files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" source/* --clobber --repo "${GITHUB_REPOSITORY}"
