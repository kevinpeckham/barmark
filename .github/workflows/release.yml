# Publishes barmark to npm via Trusted Publishing (OIDC): no tokens,
# provenance attested. Trigger: a GitHub release, or manual dispatch.
# npmjs.com package settings -> Trusted Publisher must name this repo
# and this file (release.yml).
name: release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions: {} # nothing by default; the publish job asks for exactly what it needs
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm provenance
    steps:
      # Actions pinned to commit SHAs: with id-token write in scope, a
      # compromised version tag could mint the OIDC token and publish as
      # this package. SHAs verified against the v4 tags on 2026-10-30.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing's OIDC exchange with the registry needs npm >= 11.5;
      # node 22 ships npm 10.9, which signs provenance but then PUTs
      # unauthenticated (the 404 on this workflow's first run). Pinned
      # exactly: an unpinned install inside a job holding the OIDC
      # identity is the same supply-chain exposure as an unpinned action.
      - run: npm install -g npm@12.2.1
      - run: npm publish --access public --provenance
