<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- In the static head, so crawlers (Google, Vercel's previews) find them without the app. -->
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="font-sans bg-dark bg-gradient-to-br from-blue-950/20 via-dark to-blue-950/40 text-ink max-w-screen overflow-x-hidden"
	>
		<div class="grid grid-cols-1 grid-rows-[auto_1fr_auto] max-w-full overflow-x-clip min-h-screen w-full">
			%sveltekit.body%
		</div>
	</body>
</html>
